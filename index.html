    <!-- Prevent theme flashing on page load/refresh -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
